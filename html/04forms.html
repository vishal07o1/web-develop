<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>forms-how to take data from users</title>
  </head>
  <body>
    <h1>login form</h1>
    <form action="">
      <!--action button specifies where to send data when the form is submitted-->
      <!--many different types of input/label button which has to be  learn on the way -->

      <textarea rows=" " cols="" name="" id=""></textarea>
      <!--for large amount of text-->

      <label for="email">
        email:
        <input placeholder="enter your email" type="email" name="email" />
        <!--input types - checkbox,radio-"once checked cant uncheck it",files,image,date,time -->
        <!--placeholder is just a text in the box to fill-->
      </label>
      <label for="password">
        password:
        <input type="password" name="password" />
      </label>

      <!--button goes on inside form tag-->
      <button type="submit">login</button>
    </form>

    <div>
      <select name="cricket" id="">
        <!--slect is for a dropdown menu-->
        <option value="player">player</option>
        <option value="virat">virat</option>
        <option value="rohit">rohit</option>
      </select>
    </div>
  </body>
</html>
