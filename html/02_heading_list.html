<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>headings and lists</title>
  </head>
  <body>
    <h1>Lorem ipsum dolor sit.</h1>

    <!--ul>li*4 -it gives me directly 4 list items i dont need to write 4 li's
ol for oredered and ul for unordered lists-->

    <ol>
      <li>orange tea</li>
      <li>grenn tea</li>
      <li>different tea</li>
      <li>different tea</li>
    </ol>

    <!--block level element-it takes all width/line of the web page e.g-headings
    inline level element-they takes just the spaoce they require e.g images-->
    <!--there are containers in html also like div that just stores it is a block level element-->

    <div>
      <h1>block level element--</h1>
      <ul>
        <li>headings</li>
        <li>ol,li</li>
        <li>li</li>
        <li>p</li>
      </ul>
    </div>
    <div>
      <h1>iinline element--</h1>
      <ul>
        <li>a tags</li>
        <li>img</li>
        <li>strong</li>
        <!--just to bold can also use B-->
        <li>em</li>
        <!--emphasis or it just italize the things-->
      </ul>
    </div>
  </body>
</html>
