<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>grid introduction</title>
    <style>
      .grid-container {
        display: grid; /* enables grid layout but required two steps how many colums and rows */
        grid-template-columns: repeat(
          3,
          1fr
        ); /* 3 columns of equal width fr is fraction 1 */
        grid-template-rows: 100px 200px; /* 2 rows of different height */
        gap: 2px; /* space between grid items */
        padding: 10px; /* space between grid container and grid items */
      }
      .items {
        background-color: lightblue;
        border: 1px solid #ccc;
        padding: 20px;
        text-align: center;
      }
      .item1 {
        grid-column: 1 / 3; /* till where the column goes 1 to 3 span 2 columns */
        grid-row: 1/3; /* till where the row goes 1 to 3 span 2 rows */
      }
      .item2 {
        grid-column: 3/ 4; /* till where the column goes 3 to 4 span 1 column */
        grid-row: 1/4; /* till where the row goes 1 to 2 span 1 row */
      }
      .item6 {
        grid-column: 2/3; /* till where the column goes 1 to 4 span 3 columns */
      }
    </style>
  </head>
  <body>
    <div class="grid-container">
      <div class="items item1">1</div>
      <div class="items item2">2</div>
      <div class="items">3</div>
      <div class="items">4</div>
      <div class="items">5</div>
      <div class="items item6">6</div>
    </div>
  </body>
</html>
