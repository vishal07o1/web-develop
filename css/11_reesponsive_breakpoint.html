<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>responsive design</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        padding: 0;
        background-color: bisque;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .responsive-div {
        width: 100%;
        max-width: 1200px;
        padding: 10px;
        /* margin: 5px; */
        color: rgb(165, 165, 30);
        font-size: 20px;
        background-color: black;
      }

      /* it tell when a certain pixel reaches like responsive what should
        action should be taken like chaning font color bg color in this case it is 600px of screen or less 
        it is like another css so we have to write .class below*/

      @media (max-width: 600px) {
        .responsive-div {
          background-color: aquamarine;
        }
        body {
          align-items: flex-start; /*it moves the item to top when screen reaches 600px of width*/
        }
      }
      @media (min-width: 601px) and (max-width: 700px) {
        /*it for tablets screens*/
        .responsive-div {
          background-color: orange;
        }
        body {
          align-items: flex-start; /*it moves the item to top when screen reaches 600px of width*/
        }
      }
    </style>
  </head>
  <body>
    <div class="responsive-div">this div change color based on screen size</div>
  </body>
</html>
