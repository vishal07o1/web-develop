<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>f1 stats</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      .container {
        text-align: center;
        background: linear-gradient(
          0.25turn,
          red,
          blue
        ); /* linear gradient is made up of two colors */
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        padding: 50px;
        border-radius: 10px;
        height: 100%;
      }
      .content {
        text-align: center;
        background-color: rgba(0, 0, 0, 0.2);
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        width: 90%;
      }
      .logo {
        width: 50vh;
        margin-bottom: 10px;
        border-radius: 5px;
      }
      h1 {
        font-size: 2.6rem;
        color: #333;
        margin-bottom: 10px;
      }
      p {
        font-size: 1.2rem;
        color: #666;
        padding: 10px 0;
      }
      form {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        margin-top: 20px;
      }
      input[type="email"] {
        padding: 10px;
        width: 250px;
        border-radius: 5px;
        border: 1px solid #ccc;
      }
      button {
        padding: 10px 20px;
        border-radius: 7px;
        border: none;
        background-color: #333;
        color: white;
        cursor: pointer;
        margin: 5px;
        transition: background-color 2s ease; /* it is used to give a smooth transition effect when we hover over the button which we have written below */
        width: 272px;
      }
      button:hover {
        background-color: #555;
      }
      svg {
        position: absolute;
        bottom: 0; /* it is used to position the svg at the bottom of the page */
        left: 0;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="content">
        <img src="../html/img.png" alt="ferrari car" class="logo" />
        <h1>Coming Soon...</h1>
        <p>We are working hard to bring you a new experience. Stay tuned!</p>
        <form id="notify-form">
          <input type="email" placeholder="Enter your email" required />
          <button type="submit">Notify Me</button>
        </form>
      </div>
    </div>
