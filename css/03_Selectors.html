<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>now</title>
    <style>
      /* DOM-document object model:how page is structure/layed out.transformingn your html code into a object model or tree
        that can be rnedered by the browser.understanding of dom makes you professional in css and javascript */

      /* Universal selectors:- all the browser gives a some default settings
       like margins to remove and add to all the elements a universal selector is used by "*"  */

      /* type selectors/element selector */

      /* class selectors:- by using before class "." many libraries that generate classes for you like tailwind */

      /* id selector:- it is an attribute of ID we should have a unique id and can be style by using "#" */

      /* attribut slector :- style done by taking attribute name in the square bracket
        ex:- input[type="text"]{ styling} */

      /* ADVANCED SELECTORS */

      /* Descendant Selectors:-after first child everything is a descedant(refer to lucid chart) 
      EX-article p {styling}  (element than space than element) and read as left to right that is p descedant of article */

      /* Child Selector:- it is written is EX :-  div > p {styling} */

      /* Adjacent siblings selectors:- Ex-h1+p */

      /* general sibling selectors:- Ex- h2~p */

      /* pseudo class selectors:- many elements have behviour like when select the input,hover 
      Ex- a:hover{styling} selcting a element and when hovering over it */
      /* pseudo element selectors:- p::first letter{styling} */

      /* group selector :-  h1,h2,h3{styling} */
    </style>
  </head>
  <body></body>
</html>
