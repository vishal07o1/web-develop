<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flexbox masterclass</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.6;
        margin: 0;
        padding: 20;
        background-color: aliceblue;
      }
      h1,
      h2 {
        color: brown;
      }

      .container {
        background-color: aliceblue;
        border: 2px solid black;
        margin: 20px;
        padding: 20px;
      }
      .flex-container {
        display: flex;
        height: 200px;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Flexbox masterclass</h1>
    <div class="container">
      <h2>1. Default flex(row)</h2>
      <div class="flex-container">
        <div class="circle-patel1">1</div>
        <div class="circle-patel2">2</div>
        <div class="circle-patel3">3</div>
        <div class="circle-patel4">4</div>
        <div class="circle-patel5">5</div>
      </div>
    </div>
    <div class="container">
      <h2>2.Flex direction:column</h2>
      <div
        class="flex-container"
        style="flex-direction: column-reverse; padding: 2rem"
      >
        <div class="circle pastel1">1</div>
        <div class="circle pastel2">2</div>
        <div class="circle pastel3">3</div>
        <div class="circle pastel4">4</div>
        <div class="circle pastel5">5</div>
      </div>
    </div>
    <div class="container">
      <h2>3.justify-content: space-between</h2>
      <div class="flex-container">
        <div class="circle pastel1">1</div>
        <div class="circle pastel2">2</div>
        <div class="circle pastel3">3</div>
        <div class="circle pastel4">4</div>
        <div class="circle pastel5">5</div>
      </div>
    </div>

    <div class="container">
      <h2>4.align-items:center</h2>
      <div class="flex-container">
        <div class="circle pastel1">1</div>
        <div class="circle pastel2">2</div>
        <div class="circle pastel3">3</div>
        <div class="circle pastel4">4</div>
        <div class="circle pastel5">5</div>
      </div>
    </div>
    <div class="container">
      <h2>default flex(row)</h2>
      <div class="flex-container">
        <div class="circle pastel1">1</div>
        <div class="circle pastel2">2</div>
        <div class="circle pastel3">3</div>
        <div class="circle pastel4">4</div>
        <div class="circle pastel5">5</div>
      </div>
    </div>
    <div class="container">
      <h2>default flex(row)</h2>
      <div class="flex-container">
        <div class="circle pastel1">1</div>
        <div class="circle pastel2">2</div>
        <div class="circle pastel3">3</div>
        <div class="circle pastel4">4</div>
        <div class="circle pastel5">5</div>
      </div>
    </div>
    <div class="container">
      <h2>default flex(row)</h2>
      <div class="flex-container">
        <div class="circle pastel1">1</div>
        <div class="circle pastel12">2</div>
        <div class="circle pastel123">3</div>
        <div class="circle pastel1234">4</div>
        <div class="circle pastel12345">5</div>
      </div>
    </div>
    <div class="container">
      <h2>default flex(row)</h2>
      <div class="flex-container">
        <div class="circle pastel1">1</div>
        <div class="circle pastel12">2</div>
        <div class="circle pastel123">3</div>
        <div class="circle pastel1234">4</div>
        <div class="circle pastel12345">5</div>
      </div>
    </div>
  </body>
</html>
