<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login page using tailwind</title>
    <link rel="stylesheet" href="./output.css" />
  </head>
  <body class="bg-gray-900 flex justify-center items-center min-h-screen">
    <div
      class="bg-gray-400 flex items-center justify-center flex-col gap-4 p-4 rounded-lg shadow-lg w-96"
    >
      <h2 class="text-center font-bold italic">Login</h2>
      <form>
        <div class="mb-3">
          <label
            for="email"
            class="flex rounded-lg block text-sm font-medium text-gray-700"
            >Email</label
          >
          <input
            class="flex rounded-md border border-gray-400 p-2 m-1 w-full focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-500"
            type="email"
            name="email"
            id="email"
            placeholder="enter your email"
          />
        </div>
        <div>
          <label
            for="password"
            class="flex rounded-md text-sm font-medium text-gray-700"
            >Password</label
          >
          <input
            class="flex rounded-lg border border-gray-400 p-2 m-1 w-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            type="password"
            name=""
            id=""
            placeholder="enter your password"
          />
        </div>

        <button
          type="submit"
          class="bg-blue-600 flex justify-center border border-gray-400 rounded-lg p-2 w-full mt-4 hover:bg-blue-700 shadow-xl"
        >
          Login
        </button>
      </form>
    </div>
  </body>
</html>
